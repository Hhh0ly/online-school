<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн-Школа</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; line-height: 1.6; }
        header { background: #2c3e50; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.5rem; }
        .auth-buttons button { background: #3498db; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-left: 8px; }
        .auth-buttons button:hover { background: #2980b9; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 8px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        .btn { background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 1rem; width: 100%; }
        .btn:hover { background: #27ae60; }
        
        /* Модальные окна */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 2rem; border-radius: 8px; width: 100%; max-width: 400px; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 1.5rem; cursor: pointer; }
        .tab-buttons { display: flex; margin-bottom: 1rem; border-bottom: 2px solid #eee; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: none; cursor: pointer; font-size: 1rem; }
        .tab-btn.active { border-bottom: 3px solid #3498db; font-weight: bold; color: #3498db; }
        .user-info { display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>Онлайн-Школа</h1>
        <div id="authArea" class="auth-buttons">
            <button onclick="openAuthModal('login')">Войти</button>
            <button onclick="openAuthModal('register')">Регистрация</button>
        </div>
    </header>

    <div class="container">
        <!-- Секция записи на урок -->
        <div class="card">
            <h2>Записаться на занятие</h2>
            <p style="margin-bottom: 15px; color: #666;">Выберите предмет и удобное время для занятия с преподавателем.</p>
            <form id="bookingForm" onsubmit="handleBooking(event)">
                <div class="form-group">
                    <label>Ваше Имя:</label>
                    <input type="text" id="studentName" required placeholder="Иван Иванов">
                </div>
                <div class="form-group">
                    <label>Предмет:</label>
                    <select id="subjectSelect">
                        <option value="Математика">Математика</option>
                        <option value="Физика">Физика</option>
                        <option value="Информатика">Информатика</option>
                        <option value="Английский язык">Английский язык</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Дата и время:</label>
                    <input type="datetime-local" id="bookingTime" required>
                </div>
                <button type="submit" class="btn">Отправить заявку</button>
            </form>
        </div>

        <!-- Секция со списком записей -->
        <div class="card">
            <h2>Список записей</h2>
            <ul id="bookingsList" style="list-style: none; margin-top: 10px;">
                <li>Загрузка записей...</li>
            </ul>
        </div>
    </div>

    <!-- Модальное окно Входа / Регистрации -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAuthModal()">&times;</span>
            <div class="tab-buttons">
                <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Вход</button>
                <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Регистрация</button>
            </div>

            <!-- Форма входа -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="loginEmail" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>Пароль:</label>
                    <input type="password" id="loginPassword" required placeholder="******">
                </div>
                <button type="submit" class="btn">Войти</button>
            </form>

            <!-- Форма регистрации -->
            <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
                <div class="form-group">
                    <label>Ваше Имя:</label>
                    <input type="text" id="regName" required placeholder="Иван">
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="regEmail" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>Пароль:</label>
                    <input type="password" id="regPassword" required placeholder="******">
                </div>
                <div class="form-group">
                    <label>Роль:</label>
                    <select id="regRole">
                        <option value="student">Ученик</option>
                        <option value="tutor">Преподаватель</option>
                    </select>
                </div>
                <button type="submit" class="btn" style="background-color: #3498db;">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        // Проверка авторизации при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadBookings();
        });

        function checkAuth() {
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            const authArea = document.getElementById('authArea');

            if (user) {
                authArea.innerHTML = `
                    <div class="user-info">
                        <span>👤 ${user.name} (${user.role === 'tutor' ? 'Учитель' : 'Ученик'})</span>
                        <button onclick="logout()" style="background:#e74c3c;">Выйти</button>
                    </div>
                `;
                document.getElementById('studentName').value = user.name;
            } else {
                authArea.innerHTML = `
                    <button onclick="openAuthModal('login')">Войти</button>
                    <button onclick="openAuthModal('register')">Регистрация</button>
                `;
            }
        }

        function openAuthModal(tab) {
            document.getElementById('authModal').style.display = 'flex';
            switchTab(tab);
        }

        function closeAuthModal() {
            document.getElementById('authModal').style.display = 'none';
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');

            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
            }
        }

        // Регистрация
        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;

            const res = await fetch(`${API_URL}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, role })
            });

            const data = await res.json();
            alert(data.message);
            if (data.success) {
                closeAuthModal();
            }
        }

        // Вход
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const res = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();
            if (data.success) {
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('currentUser', JSON.stringify(data.user));
                closeAuthModal();
                checkAuth();
                alert('Успешный вход!');
            } else {
                alert('Ошибка: ' + data.message);
            }
        }

        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            checkAuth();
        }

        // Запись на урок
        async function handleBooking(e) {
            e.preventDefault();
            const studentName = document.getElementById('studentName').value;
            const subject = document.getElementById('subjectSelect').value;
            const time = document.getElementById('bookingTime').value;

            const res = await fetch(`${API_URL}/bookings`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ studentName, subject, time })
            });

            const data = await res.json();
            if (data.success) {
                alert(data.message);
                loadBookings();
            }
        }

        // Загрузка записей
        async function loadBookings() {
            try {
                const res = await fetch(`${API_URL}/bookings`);
                const bookings = await res.json();
                const list = document.getElementById('bookingsList');

                if (bookings.length === 0) {
                    list.innerHTML = '<li>Записей пока нет.</li>';
                    return;
                }

                list.innerHTML = bookings.map(b => `
                    <li style="padding: 10px; border-bottom: 1px solid #eee;">
                        <strong>${b.studentName}</strong> — ${b.subject} (${new Date(b.time).toLocaleString('ru-RU')})
                    </li>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
